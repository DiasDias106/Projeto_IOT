# Mosquitto: TLS on port 1883, no anonymous access, ACL per client.
per_listener_settings false

listener 1883
protocol mqtt
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key
tls_version tlsv1.2

allow_anonymous false
# Built at container start from .env (see entrypoint.sh)
password_file /mosquitto/passwd
acl_file /mosquitto/config/acl

# Queues per client. By default the broker keeps only 1000 QoS 1 messages per subscriber and
# drops the rest: in the load test (--speed 0, about 2400 msg/s) about 15% were lost.
# With these values the whole online dataset (19,856 messages) fits in the queue.
max_inflight_messages 100
max_queued_messages 50000

persistence true
persistence_location /mosquitto/data/
# Save the sessions and queues to disk every 60 s (default: 30 min)
autosave_interval 60
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
