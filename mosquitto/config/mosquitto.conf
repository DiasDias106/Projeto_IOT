# Mosquitto: TLS na porta 1883, sem acesso anónimo, ACL por cliente.
per_listener_settings false

listener 1883
protocol mqtt
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key
tls_version tlsv1.2

allow_anonymous false
# Gerado no arranque do container a partir do .env (ver entrypoint.sh)
password_file /mosquitto/passwd
acl_file /mosquitto/config/acl

# Filas por cliente. Por omissão o broker só guarda 1000 mensagens QoS 1 por subscritor e
# descarta o resto: no teste de carga (--speed 0, cerca de 2400 msg/s) perdiam-se cerca de 15%.
# Com estes valores cabe o dataset online inteiro (19 856 mensagens) em fila.
max_inflight_messages 100
max_queued_messages 50000

persistence true
persistence_location /mosquitto/data/
# Gravar a sessão e as filas em disco a cada 60 s (por omissão: 30 min)
autosave_interval 60
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
